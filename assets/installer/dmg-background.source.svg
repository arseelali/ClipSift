      <path d="M426 190 Q426 160 456 160 H486 L505 181 H558 Q558 181 558 211 V264 H426 Z" fill="#93c5fd"/>
      <path d="M426 205 H558 V264 H426 Z" fill="#2563eb"/>
      <rect x="448" y="224" width="88" height="11" rx="5.5" fill="#dbeafe" opacity="0.82"/>
    </g>

    <g fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.94">
