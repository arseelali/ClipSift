    <text x="330" y="72" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700">Install ClipSift</text>
    <text x="330" y="104" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Drag ClipSift into Applications</text>

    <g filter="url(#softShadow)">
      <rect x="102" y="154" width="132" height="132" rx="29" fill="#f8fafc"/>
      <rect x="118" y="170" width="100" height="100" rx="22" fill="#111827"/>
      <path d="M148 198 L148 242 L188 220 Z" fill="#5eead4"/>
      <rect x="139" y="256" width="58" height="7" rx="3.5" fill="#60a5fa"/>
    </g>

    <g filter="url(#softShadow)">
